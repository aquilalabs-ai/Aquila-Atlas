services:
  # ── Aquila-Atlas backend (with all security tools pre-installed) ───────────
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - neo4j
      - qdrant
      - postgres
      - valkey
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: ["valkey-server", "--appendonly", "yes"]
    restart: unless-stopped

  mcp-neo4j:
    image: mcp/neo4j
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_TRANSPORT_MODE: http
      NEO4J_MCP_HTTP_HOST: "0.0.0.0"
      NEO4J_MCP_HTTP_PORT: "8080"
      NEO4J_TELEMETRY: "false"
      NEO4J_READONLY: "true"
    ports:
      - "8080:8080"
    depends_on:
      - neo4j
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"   # Browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: aquila
      POSTGRES_PASSWORD: aquila
      POSTGRES_DB: aquila
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  neo4j_data:
  qdrant_data:
  postgres_data:
  valkey_data:
